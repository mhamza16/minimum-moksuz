image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1500000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo fir"

[[inputs]]
at_tick = 700000
uart = 0
data = "st\necho second\n"

[assert]
uart0_contains = "msh> first\nmsh> second\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
